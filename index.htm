<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>孤岛二号 1.0</title>
<style>
  /* ========== 主题变量：改这里即可换肤 ========== */
  :root{
    --bg:#0a0f1e;
    --panel:#121a30;
    --line:#1e2a45;
    --text:#e8eefc;
    --muted:#7b8aa8;
    --accent:#38bdf8;
    --good:#22c55e;
    --warn:#f59e0b;
    --bad:#ef4444;
    --radius:14px;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:clamp(12px,.83vw,20px)}   /* 整体随窗口缩放 */
  body{
    min-height:100vh;
    background:
      radial-gradient(1200px 600px at 8% -10%, #1a2647 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 110%, #10203b 0%, transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ========== 布局 ========== */
  .dashboard{
    min-height:100vh;
    display:grid;
    grid-template-rows:auto 1fr;
    gap:clamp(10px,1vw,18px);
    padding:clamp(12px,1.4vw,26px);
  }

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    gap:1rem;padding:0 .2rem;
  }
  .brand{display:flex;align-items:center;gap:.6rem}
  .brand h1{font-size:1.15rem;font-weight:600;letter-spacing:.08em}
  .dot{
    width:.6rem;height:.6rem;border-radius:50%;background:var(--accent);
    box-shadow:0 0 0 0 rgba(56,189,248,.6);
    animation:pulse 2s infinite;
  }
  @keyframes pulse{
    70%{box-shadow:0 0 0 .6rem rgba(56,189,248,0)}
    100%{box-shadow:0 0 0 0 rgba(56,189,248,0)}
  }
  .meta{display:flex;align-items:center;gap:1rem;color:var(--muted);font-size:.85rem}
  .live{
    font-size:.7rem;letter-spacing:.15em;color:var(--good);
    border:1px solid rgba(34,197,94,.4);border-radius:99px;
    padding:.1rem .5rem;
  }
  #clock{font-variant-numeric:tabular-nums;letter-spacing:.05em}

  .grid{
    display:grid;
    gap:clamp(10px,1vw,18px);
    grid-template-columns:repeat(4,minmax(0,1fr));
    grid-auto-rows:minmax(0,1fr);
    overflow-y:auto;
  }

  /* ========== 卡片通用 ========== */
  .card{
    position:relative;
    background:linear-gradient(160deg,#161f38,#101728);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:1rem 1.1rem;
    display:flex;flex-direction:column;gap:.55rem;
    min-height:8.5rem;
    overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;inset:0 0 auto 0;height:2px;
    background:linear-gradient(90deg,transparent,var(--accent),transparent);
    opacity:.55;
  }
  .card-title{
    font-size:.8rem;color:var(--muted);
    letter-spacing:.08em;text-transform:uppercase;
  }

  /* 大数字 */
  .card-value{display:flex;align-items:baseline;gap:.3rem;margin-top:auto}
  .num{
    font-size:clamp(1.9rem,2.6vw,3.2rem);
    font-weight:700;line-height:1;
    font-variant-numeric:tabular-nums;
    letter-spacing:-.02em;
  }
  .unit{font-size:.85rem;color:var(--muted)}

  /* 趋势 */
  .card-trend{
    font-size:.78rem;font-variant-numeric:tabular-nums;
    color:var(--muted);min-height:1em;
  }
  .card-trend[data-dir="up"]{color:var(--good)}
  .card-trend[data-dir="down"]{color:var(--bad)}

  /* ========== 环形进度卡 ========== */
  .ring-card{align-items:stretch}
  .ring-wrap{
    position:relative;
    width:min(100%,9.5rem);
    aspect-ratio:1/1;
    margin:.2rem auto 0;
  }
  .ring-svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring-bg,.ring-fg{fill:none;stroke-width:9}
  .ring-bg{stroke:#1c2740}
  .ring-fg{
    stroke:var(--ring-color,var(--accent));
    stroke-linecap:round;
    stroke-dasharray:100;          /* 配合 pathLength="100" */
    stroke-dashoffset:100;
    transition:stroke-dashoffset .85s cubic-bezier(.22,1,.36,1),stroke .4s;
    filter:drop-shadow(0 0 6px var(--ring-color,var(--accent)));
  }
  .ring-center{
    position:absolute;inset:0;
    display:grid;place-content:center;text-align:center;
  }
  .ring-center .num{font-size:clamp(1.4rem,1.9vw,2.2rem)}
  .ring-center .unit{display:block;margin-top:.15rem}

  /* ========== 条形进度卡 ========== */
  .bar{
    height:.5rem;border-radius:99px;background:#1c2740;overflow:hidden;
    margin-top:auto;
  }
  .bar-fg{
    height:100%;width:0;border-radius:99px;
    background:var(--accent);
    transition:width .85s cubic-bezier(.22,1,.36,1),background .4s;
  }

  /* ========== 响应式 ========== */
  @media (max-width:1200px){ .grid{grid-template-columns:repeat(3,minmax(0,1fr))} }
  @media (max-width:900px) { .grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
  @media (max-width:560px) { .grid{grid-template-columns:1fr} }
</style>
</head>
<body>

<div class="dashboard">

  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <h1>孤岛二号 2.0</h1>
    </div>
    <div class="meta">
      <span class="live">LIVE</span>
      <time id="clock">--</time>
    </div>
  </header>

  <main class="grid">

    <!-- ① 数字卡 -->
    <section class="card" data-key="qps">
      <div class="card-title">书库信息</div>
      <div class="card-value"><span class="num">0</span><span class="unit">req/s</span></div>
      <div class="card-trend"></div>
    </section>

    <!-- ② 数字卡 -->
    <section class="card" data-key="online">
      <div class="card-title">在读书单</div>
      <div class="card-value"><span class="num">0</span><span class="unit">人</span></div>
      <div class="card-trend"></div>
    </section>

    <!-- ③ 环形卡 -->
    <section class="card ring-card" data-key="cpu">
      <div class="card-title">宿主英文单词</div>
      <div class="ring-wrap">
        <svg class="ring-svg" viewBox="0 0 120 120">
          <circle class="ring-bg" cx="60" cy="60" r="52"/>
          <circle class="ring-fg" cx="60" cy="60" r="52" pathLength="100"/>
        </svg>
        <div class="ring-center">
          <span class="num">0</span><span class="unit">%</span>
        </div>
      </div>
    </section>

    <!-- ④ 环形卡 -->
    <section class="card ring-card" data-key="success">
      <div class="card-title">宿主中文单字</div>
      <div class="ring-wrap">
        <svg class="ring-svg" viewBox="0 0 120 120">
          <circle class="ring-bg" cx="60" cy="60" r="52"/>
          <circle class="ring-fg" cx="60" cy="60" r="52" pathLength="100"/>
        </svg>
        <div class="ring-center">
          <span class="num">0</span><span class="unit">%</span>
        </div>
      </div>
    </section>

    <!-- ⑤ 条形卡 -->
    <section class="card" data-key="mem">
      <div class="card-title">保留位</div>
      <div class="card-value"><span class="num">0</span><span class="unit">%</span></div>
      <div class="bar"><div class="bar-fg"></div></div>
    </section>

    <!-- ⑥ 条形卡 -->
    <section class="card" data-key="disk">
      <div class="card-title">保留位</div>
      <div class="card-value"><span class="num">0</span><span class="unit">%</span></div>
      <div class="bar"><div class="bar-fg"></div></div>
    </section>

    <!-- ⑦ 数字卡 -->
    <section class="card" data-key="latency">
      <div class="card-title">保留位</div>
      <div class="card-value"><span class="num">0</span><span class="unit">ms</span></div>
      <div class="card-trend"></div>
    </section>

    <!-- ⑧ 数字卡 -->
    <section class="card" data-key="errors">
      <div class="card-title">保留位</div>
      <div class="card-value"><span class="num">0</span><span class="unit">/min</span></div>
      <div class="card-trend"></div>
    </section>

  </main>
</div>

<script>
(function () {
  'use strict';

  /* ============================================================
   * 1. 工具函数
   * ============================================================ */
  const fmtNum = (v, d = 0) =>
    Number(v).toLocaleString('en-US',
      { minimumFractionDigits: d, maximumFractionDigits: d });

  /** 数字滚动动画 */
  function animateNumber(el, from, to, digits) {
    if (el._raf) cancelAnimationFrame(el._raf);
    const dur = 700, t0 = performance.now();
    const tick = (t) => {
      const k = Math.min(1, (t - t0) / dur);
      const e = 1 - Math.pow(1 - k, 3);           // easeOutCubic
      el.textContent = fmtNum(from + (to - from) * e, digits);
      el._raf = k < 1 ? requestAnimationFrame(tick) : null;
    };
    el._raf = requestAnimationFrame(tick);
  }

  /** 按百分比返回颜色（invert=true 表示越低越好） */
  function colorFor(pct, invert) {
    const p = invert ? 100 - pct : pct;
    if (p >= 85) return 'var(--bad)';
    if (p >= 60) return 'var(--warn)';
    return 'var(--good)';
  }

  /* ============================================================
   * 2. 卡片注册表
   * ============================================================ */
  const registry = new Map();

  document.querySelectorAll('[data-key]').forEach((root) => {
    registry.set(root.dataset.key, {
      root,
      num:   root.querySelector('.num'),
      ring:  root.querySelector('.ring-fg'),
      bar:   root.querySelector('.bar-fg'),
      trend: root.querySelector('.card-trend'),
    });
  });

  /* ============================================================
   * 3. 对外 API：Dashboard.set(key, opts)
   *    opts = { value, digits?, trend?, invert? }
   * ============================================================ */
  function set(key, { value, digits = 0, trend, invert = false }) {
    const el = registry.get(key);
    if (!el) { console.warn('[dashboard] 未找到卡片:', key); return; }

    const v = Number(value);
    if (!Number.isFinite(v)) return;

    // —— 数字
    if (el.num) {
      const from = Number(el.num.dataset.value || 0);
      el.num.dataset.value = v;
      animateNumber(el.num, from, v, digits);
    }

    // —— 环形 / 条形（取值 0~100）
    const pct = Math.max(0, Math.min(100, v));
    const color = colorFor(pct, invert);

    if (el.ring) {
      el.ring.style.setProperty('--ring-color', color);
      el.ring.style.strokeDashoffset = 100 - pct;
    }
    if (el.bar) {
      el.bar.style.width = pct + '%';
      el.bar.style.background = color;
    }

    // —— 趋势
    if (el.trend && trend !== undefined) {
      const up = Number(trend) >= 0;
      el.trend.textContent =
        `${up ? '▲' : '▼'} ${Math.abs(trend).toFixed(1)}%`;
      el.trend.dataset.dir = up ? 'up' : 'down';
    }

    // —— 变化高亮
    el.root.animate(
      [{ boxShadow: 'inset 0 0 0 1px var(--accent)' },
       { boxShadow: 'inset 0 0 0 1px transparent' }],
      { duration: 600, easing: 'ease-out' }
    );
  }

  /** 批量更新 */
  function updateAll(payload) {
    Object.entries(payload).forEach(([k, v]) => set(k, v));
  }

  /* ============================================================
   * 4. 时钟
   * ============================================================ */
  const clockEl = document.getElementById('clock');
  const pad = (n) => String(n).padStart(2, '0');
  function tickClock() {
    const d = new Date();
    clockEl.textContent =
      `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ` +
      `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }
  tickClock();
  setInterval(tickClock, 1000);

  /* ============================================================
   * 5. 双击全屏
   * ============================================================ */
  document.addEventListener('dblclick', () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  });

  /* ============================================================
   * 6. 数据源接入
   *    ↓ 二选一：轮询 JSON / SSE。默认用 mock，删掉即可。
   * ============================================================ */

  /* --- 方式 A：轮询 JSON 文件（Shell 脚本生成 data.json 即可） ---
  async function poll() {
    try {
      const res = await fetch('data.json?t=' + Date.now());
      if (res.ok) updateAll(await res.json());
    } catch (e) { /* 静默失败，保持上一帧 */ }
  }
  poll();
  setInterval(poll, 2000);
  */

  /* --- 方式 B：SSE（服务端 text/event-stream） ---
  const es = new EventSource('/stream');
  es.onmessage = (e) => {
    try { updateAll(JSON.parse(e.data)); } catch (_) {}
  };
  */

  /* --- 方式 C：WebSocket ---
  const ws = new WebSocket('ws://' + location.host + '/ws');
  ws.onmessage = (e) => {
    try { updateAll(JSON.parse(e.data)); } catch (_) {}
  };
  */

  /* --- 默认：Mock 数据（演示用，接入真实数据后删除） --- */
  const rnd = (min, max, d = 0) =>
    Number((min + Math.random() * (max - min)).toFixed(d));

  function mock() {
    updateAll({
      qps:     { value: rnd(800, 2400),          trend: rnd(-8, 12, 1) },
      online:  { value: rnd(1200, 5600),          trend: rnd(-5, 9, 1) },
      cpu:     { value: rnd(20, 95, 1) },
      success: { value: rnd(92, 100, 2),          invert: true },
      mem:     { value: rnd(30, 90, 1) },
      disk:    { value: rnd(40, 88, 1) },
      latency: { value: rnd(18, 240), digits: 0,  trend: rnd(-20, 20, 1) },
      errors:  { value: rnd(0, 30),               trend: rnd(-50, 50, 1) },
    });
  }
  mock();
  setInterval(mock, 2500);

  /* ============================================================
   * 7. 暴露到全局，方便外部调用 / 控制台调试
   * ============================================================ */
  window.Dashboard = { set, updateAll };

})();
</script>
</body>
</html>
